<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Settings | Student Productivity</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="settings-page">
      <header class="page-header">
        <p class="eyebrow">Student Productivity</p>
        <h1>Settings</h1>
        <p class="intro">Manage your profile and notification preferences.</p>
      </header>

      <form class="settings-card" id="settings-form" novalidate>
        <section aria-labelledby="profile-heading">
          <h2 id="profile-heading">Profile</h2>

          <div class="field">
            <label for="display-name">Display name</label>
            <input id="display-name" name="displayName" type="text" autocomplete="name"
              required aria-describedby="display-name-error" />
            <p class="field-error" id="display-name-error"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email"
              required aria-describedby="email-error" />
            <p class="field-error" id="email-error"></p>
          </div>
        </section>

        <section class="notification-section" aria-labelledby="notifications-heading">
          <h2 id="notifications-heading">Notifications</h2>
          <label class="checkbox-row" for="notifications">
            <input id="notifications" name="notifications" type="checkbox" checked />
            <span>Send me study reminders and updates</span>
          </label>
        </section>

        <div class="form-footer">
          <p class="success-message" id="success-message" role="status" aria-live="polite" hidden>
            Your settings have been saved.
          </p>
          <button type="submit">Save changes</button>
        </div>
      </form>
    </main>
  </body>
</html>
